experiment: yolo_wsd_topology_pruning
seed: 42
deterministic: true

models:
  - family: yolov5
    weights: yolov5s.pt
  - family: yolo26
    weights: yolo26s.pt

inference:
  image_size: 640

data:
  # Generated by `make audit-wsd`; never commit machine-specific paths.
  yaml: data/wsd.yaml

peek:
  # Frozen before inspecting any pruning outcomes. Modules are post-block outputs
  # at three backbone scales followed by their three neck counterparts.
  modules: [4, 6, 10, 16, 19, 22]
  sample_count: 128
  correct_detections_only: false
  sampling_manifest: docs/wsd-v71-peek-calibration.json
  map_unit: per_image_per_module
  batch_handling: split_batch_before_peek
  empty_scene_policy: include_if_selected
  capture_dtype: float32

topology:
  homology_dimensions: [0, 1]
  normalize_maps: minmax
  filtration: superlevel
  diagram_distances: [bottleneck, wasserstein_2]

pruning:
  # Research placeholder: candidate generation is deliberately not asserted yet.
  target_sparsities: [0.10, 0.20, 0.30, 0.40, 0.50]
  topology_weight: 0.5
  peek_variance_weight: 0.5
