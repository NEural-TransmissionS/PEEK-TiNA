experiment: wsd_yolo26n_pretrained_error_driven_node2_attempt2
seed: 42
deterministic: true

data: data/wsd.yaml
image_size: 640
epochs: 1000
batch_size: 16
workers: 8
patience: 100
device: "0"
initializations: [pretrained]
output: runs/tuning_yolo26_error_driven_node2

# Fresh names preserve the interrupted node2 attempts without resuming or overwriting them.
# Selection uses validation mAP@0.5:0.95; test data must not be evaluated during tuning.
trials:
  - name: localization_emphasis_node2_attempt2
    yolov5: {}
    yolo26:
      optimizer: auto
      box: 10.0
      dfl: 2.0
  - name: multiscale_classification_node2_attempt2
    yolov5: {}
    yolo26:
      optimizer: auto
      multi_scale: 0.5
      scale: 0.3
      cls: 0.75
  - name: classification_mild_node2_attempt2
    yolov5: {}
    yolo26:
      optimizer: auto
      cls: 0.75
  - name: multiscale_localization_node2_attempt2
    yolov5: {}
    yolo26:
      optimizer: auto
      multi_scale: 0.5
      scale: 0.3
      box: 10.0
      dfl: 2.0

models:
  - family: yolo26
    weights: yolo26n.pt
    config: yolo26n.yaml
